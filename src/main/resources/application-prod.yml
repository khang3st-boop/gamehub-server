# Profile production: PostgreSQL, sau reverse proxy HTTPS (Caddy/Nginx). MỌI bí mật lấy từ biến môi trường.
# Bắt buộc: GAMEHUB_JWT_SECRET (≥ 32 byte) và CSDL: DB_URL + DB_USER + DB_PASSWORD, HOẶC một biến DATABASE_URL
# (postgresql://user:pass@host/db?sslmode=require — xem DatabaseUrlEnvironmentPostProcessor).
# Nên đặt GAMEHUB_CORS_ORIGINS (https://ten-mien) nếu web chạy ở tên miền khác server.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    show-sql: false

server:
  # Tin header X-Forwarded-* chỉ từ proxy trong mạng nội bộ (mặc định của Tomcat: 10/8, 172.16/12, 192.168/16, 127/8)
  # → giới hạn tần suất theo IP thật của người dùng, và URL tuyệt đối dùng https.
  forward-headers-strategy: native
  shutdown: graceful
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:200}

springdoc:
  api-docs:
    enabled: ${GAMEHUB_SWAGGER:false}
  swagger-ui:
    enabled: ${GAMEHUB_SWAGGER:false}

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN

gamehub:
  cors:
    # Web phục vụ cùng tên miền không cần CORS. Trên Render, RENDER_EXTERNAL_URL (https://<ten>.onrender.com)
    # được nền tảng tự đặt → dùng làm mặc định khi chưa khai báo GAMEHUB_CORS_ORIGINS.
    allowed-origins: ${GAMEHUB_CORS_ORIGINS:${RENDER_EXTERNAL_URL:}}
