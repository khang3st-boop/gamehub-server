<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Game Hub 4-in-1: Rubik 3D, Sudoku, Xếp hình, Caro.">
  <!-- viewport-fit=cover: vẽ tràn dưới tai thỏ/Dynamic Island; Flutter tự đọc
       safe-area qua MediaQuery.padding. Chặn phóng to bằng hai chạm để không
       phá thao tác vuốt Rubik. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F5F7FF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#151928" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Game Hub">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Game Hub 4-in-1</title>
  <style>
    /* Nền khớp giao diện trong lúc tải; không cuộn/bật nảy trang trên Safari. */
    html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none;
      background: #F5F7FF; -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
    @media (prefers-color-scheme: dark) { html, body { background: #151928; } }
    #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      font: 600 16px -apple-system, system-ui, sans-serif; color: #635BFF; }
  </style>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="boot">Đang tải Game Hub…</div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var b = document.getElementById('boot'); if (b) b.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
