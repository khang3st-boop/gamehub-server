plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.gamehub'
version = '1.0.0'
description = 'Game Hub 4 in 1 — REST API (Spring Boot)'

java {
    // Biên dịch cho Java 21 (chạy được trên JDK 21+), không cần toolchain tự tải.
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-parameters', '-Xlint:unchecked']
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.0'

    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'com.h2database:h2'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // PostgreSQL thật chạy nhúng (tải binary từ Maven Central, không cần cài/Docker):
    // test Flyway + JPA trên PostgreSQL, và task localPostgres để chạy server prod trên máy.
    testImplementation 'io.zonky.test:embedded-postgres:2.2.2'
    testImplementation enforcedPlatform('io.zonky.test.postgres:embedded-postgres-binaries-bom:17.11.0')
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'failed'
        exceptionFormat 'full'
    }
}

// PostgreSQL cục bộ cho chạy thử profile prod: ./gradlew localPostgres  (cổng 5433, dữ liệu ở data/pg)
tasks.register('localPostgres', JavaExec) {
    group = 'application'
    description = 'Chạy PostgreSQL nhúng (cổng 5433) để thử server profile prod trên máy'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.gamehub.server.LocalPostgres'
    standardInput = System.in
}

bootJar {
    archiveFileName = 'gamehub-server.jar'
}

jar {
    enabled = false
}
