# Kiểm thử mỗi lần push/PR. Render (autoDeployTrigger: checksPass) chỉ triển khai khi job này PASS.
name: backend-ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      # H2 + PostgreSQL 17 nhúng (zonky) — không cần dịch vụ CSDL ngoài.
      - run: chmod +x gradlew && ./gradlew --no-daemon test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-report
          path: build/reports/tests/test
